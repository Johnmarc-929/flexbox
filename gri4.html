<!DOCTYPE html!>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Grid nested in CSS 
        </title>
        <style>
            body{
                background-color: rgb(230, 232, 233);
                font-family: cambria;
                text-align:center;
            }
            #content{
                display:grid;
            grid-template-columns: repeat(3, 1fr);
                margin: 0 auto;
                max-width: 980px;
                grid-gap: 10px;/*short- hand rule*/
            }
            #content div{
                background-color: #3bbced;
                padding: 30px;
            }
            #content div:nth-child(even){
                background-color: #777;
            }
            .nest{
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-gap: 10px;
                grid-column:span 3;
            }
            .nest p{
                border: 1px, solid #fff;
                border-radius: 5.5px;
                padding: 10px;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div id="content">
            <div>1</div>
            <div>2</div>
            <div class="nest">
                <p>1</p>
                <p>2</p>
                <p>3</p>
                <p>4</p>
            </div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
        </div>
    </body>
</html>
