<!DOCTYPE html!>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Grid lines in CSS 
        </title>
        <style>
            body{
                background-color: rgb(230, 232, 233);
                font-family: cambria;
                text-align:center;
            }
            #content{
                display:grid;
            grid-template-columns: repeat(3, 1fr); /* more like a short-hand rule*/
            grid-template-rows: repeat(3, minmax(100px, auto));/* you can set the number of rows fromm 3 to 10 or more and it will space for the ten rows*/
                margin: 0 auto;
                max-width: 980px;
                grid-gap: 10px;/*short- hand rule*/
            }
            #content div{
                background-color: #3bbced;
                padding: 30px;
            }
            #content div:nth-child(even){
                background-color: #777;
            }
            .one{
                /*grid-column-start: 1;
                grid-column-end: 3;*/
                grid-column: 1/3;
            }
            .two{
                grid-column: 3/7;
            }
            .three{
                grid-column: 1/4;
                grid-row: 2/4;
            }
            .four{
                grid-column: 4/7;
                grid-row: 2/4;
            }
            .five{
                grid-column: 3/7;
            }
            .six{
                grid-column: 1/3;
                grid-row: 4/5;
            }
        </style>
    </head>
    <body>
        <div id="content">
            <div class="one">1</div>
            <div class="two">2</div>
            <div class="three">3</div>
            <div class="four">4</div>
            <div class="five">5</div>
            <div class="six">6</div>
        </div>
    </body>
</html>
