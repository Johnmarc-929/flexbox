<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title> grid areas</title>
        <style>
            body{
                color: #fff;
                text-align: center;
                font-family: sans-serif;
            }
            #content{
                display: grid;
                margin: 0 auto;
                max-width: 980px;
                grid-template-columns: repeat(5, 1fr);
                grid-auto-rows: minmax(150px, auto);
                grid-gap: 10px;

                grid-template-areas: 
                "header header header header header" 
                "main main main aside aside" 
                "main main main . nav" /* the dot before the word "nav" is used to leave a gap */
                "section section section section section" 
                "footer footer footer footer footer";

            }
            #content >*{
                background: #3bbced;
                padding: 30px;
            }
            header{
                grid-area: header;
            }
            main{
                grid-area: main;
            }
            section{
                grid-area: section;
            }
            aside{
                grid-area: aside;
            }
            nav{
                grid-area: nav;
            }
            Footer{
                grid-area: footer;
            }
        </style>
    </head>
    <body>
        <div id="content">

           <header>Header</header>
            <main>Main</main>
            <section>section</section>
            <aside>Aside</aside>
            <nav>Nav</nav>
            <footer>Footer</footer>
        </div>
    </body>
</html>
