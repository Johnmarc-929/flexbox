<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="veiwport" content="width=device-width, initial-scale=1.0">
        <title>
            Flexbox 3
        </title>
        <style>
            body{
                background-color: #eeeeee;
                text-align: center;
                font-weight: bold;
            }
            .wrapper{
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
            }
            .container{
                display: flex; 
                justify-content: space-between;
               
            }
            .box{
                height: 100px;
                width: 100px;
                text-align: center;
            }
            /* looking at the ordering of the elements  the normal order starts with 0 and either decreases or increases, when you assign one of the 
            elemnts a negative value, it comes first and if you assign another a positive value, it come after any with a value less than it*/
            .one{
                background-color: #777;
                order: 0;
            }
            .two{
                background-color: #777;
                order: 2;
            }
            .three{
                background-color: #777;
                order:-1;
            }
            .four{
                background-color: #777;
                order: 1;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="container">
                <div class="box one">1</div>
                <div class="box two">2</div>
                <div class="box three">3</div>
                <div class="box four">4</div>
            </div>
        </div>
    </body>
</html>
