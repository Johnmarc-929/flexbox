<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Creating a twelve grid page</title>
        <style>
            body{
                color: #fff;
                font-family: georgia;
                text-align: center;
            }
            #content{
                display: grid;
                max-width: 980px;
                grid-template-columns: repeat(12, 1fr);
                grid-auto-rows: minmax(150px, auto);
                grid-gap: 10px;
                margin: 0 auto;
                position: relative;
            }
            #content >*{
                background-color: #3bbced;
                padding: 30px;
            }
            header{
                grid-column: 1/13;
            }
            main{
                grid-column: 1/9;
                grid-row: 2/4;
            }
            aside{
                grid-column: 9/13;
            }
            section{
                grid-column: 1/13;
                grid-row: 4/6;
            }
            nav{
                grid-column: 9/13;
            }
            footer{
                grid-column: 1/13;
            }
            #grid{
                display: grid;
                position: absolute;
                top: 0;
                left: 0;
                grid-template-columns: repeat(12, 1fr);
                grid-auto-rows: minmax(100%, auto);
                width: 100%;
                height: 100%;
                background: transparent;
                padding: 0;
                display: none;
            }
            #grid p{
                background: #000;
                margin: 0;
                border: 1px solid;
                opacity: 0.2;

            }
            input:checked + #content #grid{
                display: grid;
            }

        </style>
    </head>
    <body>
        <input type="checkbox"/>
        <div id="content">

            <div id="grid">
                <p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p><p></p>
            </div>



            <header>Header</header>
            <main>Main</main>
            <section>section</section>
            <aside>Aside</aside>
            <nav>Nav</nav>
            <footer>Footer</footer>
        </div>
    </body>
</html>
