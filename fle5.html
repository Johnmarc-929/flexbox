<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="veiwport" content="width=device-width, initial-scale=1.0">
        <title>
            Flexbox 2
        </title>
        <style>
            body{
                background-color: #eeeeee;
                color: white;
                text-align: center;
                font-weight: bold;
            }
            .wrapper{
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
            }
            .container{
                display: flex; 
                background-color: #fff;
                flex-wrap: wrap;
                flex-flow: row; /* using the flex-flow property that uses values like row, row-reverse, column and column-reverse. */
                align-items: center;
                justify-content: center; /*this will allow us to place the elements in the center. and by combining both the justify-content and align-items as center, places the element in the middle of the div container */
                height: 400px;
            }
            .box{
                height: 100px;
                width: 100px;
            }
            .one{
                background-color: red;
            }
            .two{
                background-color: blue;
            }
            .three{
                background-color: green;
            }
        </style>
    </head>
    <body>
        <div class="wrapper">
            <div class="container">
                <div class="box one">1</div>
                <div class="box two">2</div>
                <div class="box three">3</div>
            </div>
        </div>
    </body>
</html>
