<!DOCTYPE html!>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Grid aligned in CSS 
        </title>
        <style>
            body{
                background-color: white;
                font-family: cambria;
                text-align:center;
            }
            #content{
                display:grid;
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: minmax(200px, auto);
                margin: 0 auto;
                max-width: 980px;
                grid-gap: 10px;/*short- hand rule*/
                
            }
            #content div{
                background-color: #3bbced;
                padding: 30px;
            }
            #content div:nth-child(even){
                background-color: #777;
            }
            .one{
                align-self: start;
                justify-self: start;
            }
            .two{
                align-self: center;
                justify-self: center;
            }
            .three{
                align-self: end;
                justify-self: end;
            }
          
        </style>
    </head>
    <body>
        <div id="content">
            <div class="one">1</div>
            <div class="two">2</div>
            <div class="three">3</div>
            <div class="four">4</div>
            <div class="five">5</div>
            <div class="six">6</div>
        </div>
    </body>
</html>
