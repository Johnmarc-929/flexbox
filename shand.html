<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="veiwport" content="width=device-width, intial-scale=1.0">
        <title>
            shorthand flex rule
        </title>
        <style>
            body{
                background-color: #eee;
                color: white;
                text-align: center;
            }
            .wrap{
                width: 100%;
                max-width: 980px;
                margin: 0 auto;
            }
            .container{
                display: flex;
                background-color: #fff;
                flex-wrap: wrap;
            }
            .box{
                height: 100px;
                min-width: 100px;
                flex: 1 0 300px;
            }
            .one{
                background-color: green;
            }
            .two{
                background-color: red;
            }
            .three{
                background-color: blue;
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <div class="container">
                <div class="box one">One</div>
                <div class="box two">Two</div>
                <div class="box three">Three</div>
            </div>
        </div>
    </body>
</html>
