<!DOCTYPE html!>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Grids in CSS
        </title>
        <style>
            body{
                background-color: rgb(230, 232, 233);
                font-family: cambria;
                text-align:center;
            }
            .content{
                display:grid;
            /* grid-template-columns: 20% 30% 50%; you can use percentages as well*/
            /* grid-template-columns: 1fr 1fr 1fr; you can use these fractions as well*/
            grid-template-columns: repeat(3, 1fr); /* more like a short-hand rule*/
                margin: 0 auto;
                max-width: 1200px;
            }
            .content div{
                background-color: #3bbced;
                padding: 30px;
            }
            .content div:nth-child(even){
                background-color: #777;
            }
        </style>
    </head>
    <body>
        <div class="content">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
        </div>
    </body>
</html>
